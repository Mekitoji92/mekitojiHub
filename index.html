<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0F15">
<title>Mekitoji Hub</title>
<style>
:root {
  --bg: #0B0F15;
  --surface: #171E29;
  --fg: #E8EDF5;
  --muted: #8896AB;
  --line: #273140;
  --accent: #7DA2FF;
  --f: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #0B0F15; color-scheme: dark; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f);
  padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  align-items: center;
}
main { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 28px; margin-block: auto; }
h1 { margin: 0; font-size: 30px; line-height: 1.1; letter-spacing: -0.02em; text-align: center; }
nav { display: flex; flex-direction: column; gap: 14px; }
a.big {
  display: flex; align-items: center; gap: 16px;
  min-height: 96px; padding: 18px 20px;
  background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 18px;
  text-decoration: none; font-size: 22px; font-weight: 650;
}
a.big .ico { font-size: 34px; line-height: 1; width: 44px; text-align: center; flex: none; }
a.big .txt { flex: 1; min-width: 0; }
a.big .go { color: var(--muted); font-size: 26px; flex: none; }
a.big:hover { border-color: var(--accent); }
a.big:active { transform: scale(.985); }
a.big:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  a.big { transition: border-color .15s, transform .1s; }
}
</style>
</head>
<body>
<main>
  <h1>Mekitoji Hub</h1>
  <nav>
    <a class="big" href="acatist/index.html"><span class="ico" aria-hidden="true">🙏</span><span class="txt">Acatiste</span><span class="go" aria-hidden="true">›</span></a>
    <a class="big" href="dogfood/index.html"><span class="ico" aria-hidden="true">🐶</span><span class="txt">Hrană câini</span><span class="go" aria-hidden="true">›</span></a>
    <a class="big" href="credit/index.html"><span class="ico" aria-hidden="true">💳</span><span class="txt">Rambursare credit</span><span class="go" aria-hidden="true">›</span></a>
    <a class="big" href="mobrick/index.html"><span class="ico" aria-hidden="true">🧱</span><span class="txt">Zile lucrate Mobrick</span><span class="go" aria-hidden="true">›</span></a>
  </nav>
</main>
</body>
</html>
