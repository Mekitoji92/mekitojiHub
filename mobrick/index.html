<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat ma costa - Mobrick</title>
    <meta name="description"
        content="Calculează câte zile și ore trebuie să lucrezi pentru a-ți permite orice obiect pe baza venitului tău net.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
.hubbtn{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:2147483000;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 18px 0 14px;border-radius:999px;background:rgba(15,19,26,.9);color:#E8EDF5;border:1px solid rgba(255,255,255,.22);font:600 16px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.3);-webkit-tap-highlight-color:transparent}
.hubbtn:active{transform:scale(.96)}
.hubbtn:focus-visible{outline:3px solid #7DA2FF;outline-offset:2px}
body{box-sizing:border-box;padding-top:calc(64px + env(safe-area-inset-top))}
</style>
</head>

<body>
<a class="hubbtn" href="../index.html" aria-label="Înapoi la Hub">← Hub</a>
    <div class="blob-container">
        <div class="blob"></div>
        <div class="blob-container">
            <div class="blob"></div>
        </div>
    </div>

    <main class="container">
        <header>
            <h1>Calculator <br><span class="gradient-text">Cât mă costă</span></h1>
            <p>Vizualizează prețul real al achizițiilor tale în ore lucrate.</p>
        </header>

        <section class="calculator-card">
            <div class="input-group">
                <label for="net-income">Venit Lunar Net (Lei)</label>
                <input type="number" id="net-income" placeholder="3500" min="0">
            </div>

            <div class="input-group">
                <label for="work-hours-display">Ore Lucrate în această <label for=""></label>ună</label>
                <div id="work-hours-display" class="readonly-display">160</div>
            </div>

            <div class="input-group">
                <label for="item-price">Preț Obiect (Lei)</label>
                <input type="number" id="item-price" placeholder="1000" min="0">
            </div>

            <div id="results" class="results-container hidden">
                <div class="result-item">
                    <span class="label">Timp Necesar</span>
                    <div id="time-display" class="value">0 Zile, 0 Ore</div>
                </div>
                <div class="result-item">
                    <span class="label">Salariu pe Oră</span>
                    <div id="hourly-wage" class="value">Ron 0.00 / oră</div>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <p class="insight" id="insight-text">Va trebui să lucrezi aproximativ 0% din lună pentru a-ți permite
                    asta.</p>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Mobrick. Dezvoltat din Pasiune.</p>
        </footer>
    </main>

    <script src="main.js"></script>
</body>

</html>
